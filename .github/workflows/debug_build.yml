name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7, apt-android-5 ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
          BUILD_VERSION_CODE: ${{ github.run_number }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          echo "Setting vars"

          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
              GITHUB_SHA="${{ github.event.pull_request.head.sha }}" # Do not use last merge commit set in GITHUB_SHA
          fi

          # Derive a monotonically increasing version from the build number so every main
          # build ships a strictly greater version than the previous one and the in-app
          # updater can detect a newer build. github.run_number is monotonic across runs.
          BASE_VERSION_NAME_REGEX='\s+versionName "([0-9]+)\.([0-9]+)\.[0-9]+"$'
          BASE_MAJOR="$(grep -m 1 -E "$BASE_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$BASE_VERSION_NAME_REGEX/\1/")"
          BASE_MINOR="$(grep -m 1 -E "$BASE_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$BASE_VERSION_NAME_REGEX/\2/")"
          BUILD_VERSION_NAME="$BASE_MAJOR.$BASE_MINOR.$BUILD_VERSION_CODE"

          # Set RELEASE_VERSION_NAME to "<BUILD_VERSION_NAME>+<last_commit_hash>"
          RELEASE_VERSION_NAME="v$BUILD_VERSION_NAME+${GITHUB_SHA:0:7}" # The "+" is necessary so that versioning precedence is not affected
          if ! printf "%s" "${RELEASE_VERSION_NAME/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
           exit_on_error "The versionName '${RELEASE_VERSION_NAME/v/}' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html."
          fi

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-${{ env.PACKAGE_VARIANT }}-github-debug" # Note the "-", GITHUB_SHA will already have "+" before it
          APK_BASENAME_PREFIX="termux-app_$APK_VERSION_TAG"

          # Used by attachment and release-publish steps later
          echo "APK_DIR_PATH=$APK_DIR_PATH" >> $GITHUB_ENV
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> $GITHUB_ENV
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> $GITHUB_ENV
          echo "BUILD_VERSION_NAME=$BUILD_VERSION_NAME" >> $GITHUB_ENV
          echo "BUILD_VERSION_CODE=$BUILD_VERSION_CODE" >> $GITHUB_ENV

          echo "Building APKs for 'APK_VERSION_TAG' build"
          export TERMUX_APP_VERSION_NAME="$BUILD_VERSION_NAME" # Used by app/build.gradle
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG" # Used by app/build.gradle
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}" # Used by app/build.gradle
          if ! ./gradlew assembleDebug -PbuildVersionCode="$BUILD_VERSION_CODE"; then
            exit_on_error "Build failed for '$APK_VERSION_TAG' build."
          fi

          echo "Validating APKs"
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk"; then
              files_found="$(ls "$APK_DIR_PATH")"
              exit_on_error "Failed to find built APK at '$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk'. Files found: "$'\n'"$files_found"
            fi
          done

          echo "Generating sha25sums file"
          if ! (cd "$APK_DIR_PATH"; sha256sum \
            "${APK_BASENAME_PREFIX}_universal.apk" \
            "${APK_BASENAME_PREFIX}_arm64-v8a.apk" \
            "${APK_BASENAME_PREFIX}_armeabi-v7a.apk" \
            "${APK_BASENAME_PREFIX}_x86_64.apk" \
            "${APK_BASENAME_PREFIX}_x86.apk" \
            > "${APK_BASENAME_PREFIX}_sha256sums"); then
            exit_on_error "Generate sha25sums failed for '$APK_VERSION_TAG' release."
          fi

      - name: Attach universal APK file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_universal
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_universal.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach arm64-v8a APK file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package_variant == 'apt-android-7' && format('termux-app-RECOMMENDED-INSTALL-THIS-{0}-arm64-v8a', env.APK_VERSION_TAG) || format('{0}_arm64-v8a', env.APK_BASENAME_PREFIX) }}
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_arm64-v8a.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach armeabi-v7a APK file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_armeabi-v7a.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach x86_64 APK file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_x86_64
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86_64.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach x86 APK file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_x86
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_x86.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Attach sha256sums file
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APK_BASENAME_PREFIX }}_sha256sums
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME_PREFIX }}_sha256sums
            ${{ env.APK_DIR_PATH }}/output-metadata.json

      - name: Publish APKs to GitHub Release on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.package_variant == 'apt-android-7'
        shell: bash {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          # Use the per-build version derived in the build step so the release tag is unique
          # per build and carries the same comparable version the APK reports. Do NOT reuse a
          # single static tag, otherwise the in-app updater can never see a newer release.
          RELEASE_VERSION_NAME="$BUILD_VERSION_NAME"
          RELEASE_TAG="v$RELEASE_VERSION_NAME"

          STABLE_DIR="$APK_DIR_PATH/release-assets"
          mkdir -p "$STABLE_DIR"
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            if ! cp "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_$abi.apk" "$STABLE_DIR/termux-app_$abi.apk"; then
              exit_on_error "Failed to stage stable-named APK for '$abi'."
            fi
          done
          cp "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_sha256sums" "$STABLE_DIR/termux-app_sha256sums"

          RELEASE_NOTES="Automated build of main at ${GITHUB_SHA:0:7} (version $RELEASE_VERSION_NAME, build $BUILD_VERSION_CODE). Install the APK matching your device ABI; termux-app_arm64-v8a.apk is recommended. termux-app_universal.apk works on all ABIs. The in-app updater reads this release via the anonymous releases/latest API."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if ! gh release upload "$RELEASE_TAG" "$STABLE_DIR"/* --clobber; then
              exit_on_error "Failed to upload assets to existing release '$RELEASE_TAG'."
            fi
            if ! gh release edit "$RELEASE_TAG" --title "$RELEASE_VERSION_NAME" --notes "$RELEASE_NOTES" --latest; then
              exit_on_error "Failed to update existing release '$RELEASE_TAG'."
            fi
          else
            if ! gh release create "$RELEASE_TAG" "$STABLE_DIR"/* --target "$GITHUB_SHA" --title "$RELEASE_VERSION_NAME" --notes "$RELEASE_NOTES" --latest; then
              exit_on_error "Failed to create release '$RELEASE_TAG'."
            fi
          fi

  post_artifact_links:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: post-artifact-links-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Post APK download links to PR description
        uses: actions/github-script@v7
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });

            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });

            const suiteId = run.check_suite_id;
            const makeUrl = (a) => `https://github.com/${context.repo.owner}/${context.repo.repo}/suites/${suiteId}/artifacts/${a.id}`;

            const recommendedArtifactNamePrefix = 'termux-app-RECOMMENDED-INSTALL-THIS';
            const arm64Artifact = artifacts.find(a => a.name.startsWith(recommendedArtifactNamePrefix) && a.name.endsWith('arm64-v8a'));

            const startMarker = '<!-- apk-artifact-links -->';
            const endMarker = '<!-- /apk-artifact-links -->';
            const section = [
              startMarker,
              arm64Artifact ? `APK: ${makeUrl(arm64Artifact)}` : '(artifact not found)',
              endMarker
            ].join('\n');

            const prNumber = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const currentBody = pr.body || '';
            let newBody;
            if (currentBody.includes(startMarker)) {
              newBody = currentBody.replace(
                new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`),
                section
              );
            } else {
              newBody = currentBody + '\n\n' + section;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: newBody
            });
