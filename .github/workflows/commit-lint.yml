# DO NOT EDIT DIRECTLY.
# This file is auto-synchronized from HiromiShikata/repositories-management.
# Direct edits in downstream repositories will be overwritten by the next sync.
# Update the source file in HiromiShikata/repositories-management instead.

name: Lint Commit Messages
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    if: vars.PULL_REQUEST_CHECKS_IN_REPOSITORY_CI != 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 7
    permissions:
      issues: read
      pull-requests: write
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0

      - name: Check for DONTMERGE
        run: |
          result=$(find . \
            -type f \
            ! -path './.github/workflows/commit-lint.yml' \
            ! -name '*.snap' \
            -exec grep -Hn 'DONTMERGE' {} \;)
          if [[ ! -z "$result" ]]; then
            echo "$result"
            exit 1
          fi
      - uses: nearform-actions/github-action-check-linked-issues@da25b46705a9da660023ab77cb0e5672a65e2910 # v1.9.0
        id: check-linked-issues
        if: false
        with:
          exclude-branches: 'release/**, dependabot/**, project-common/**'
          loose-matching: true
      - name: Check for bare issue-number shorthand
        if: github.head_ref != 'fleet-live' && github.head_ref != 'fleet-live-to-main'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git log --format=%s "origin/${{ github.event.repository.default_branch }}..HEAD" > "$RUNNER_TEMP/commit-subjects.txt"
          "$GITHUB_WORKSPACE/scripts/reject-bare-issue-number-references.sh" "$RUNNER_TEMP/commit-subjects.txt"
      - name: Check PR title follows conventional commit format
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
            autogen
            prep
            adapt
      - name: Resolve commitlint cache key
        id: commitlint-cache-key
        if: github.head_ref != 'fleet-live' && github.head_ref != 'fleet-live-to-main'
        run: |
          set -euo pipefail
          CLI_VERSION=$(npm view @commitlint/cli version)
          CONFIG_VERSION=$(npm view @commitlint/config-conventional version)
          echo "key=${CLI_VERSION}-${CONFIG_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Restore commitlint install
        if: github.head_ref != 'fleet-live' && github.head_ref != 'fleet-live-to-main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/commitlint-run
          key: commitlint-${{ runner.os }}-${{ steps.commitlint-cache-key.outputs.key }}
      - name: Install commitlint
        if: github.head_ref != 'fleet-live' && github.head_ref != 'fleet-live-to-main'
        run: |
          if [ -x /tmp/commitlint-run/node_modules/.bin/commitlint ]; then
            echo "commitlint restored from cache"
            exit 0
          fi
          mkdir -p /tmp/commitlint-run
          cd /tmp/commitlint-run
          npm init -y
          npm install --no-fund --save-dev @commitlint/cli @commitlint/config-conventional
      - name: Lint commits
        if: github.head_ref != 'fleet-live' && github.head_ref != 'fleet-live-to-main'
        env:
          NODE_PATH: /tmp/commitlint-run/node_modules
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH_REF: origin/${{ github.event.repository.default_branch }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          FROM_REF="$DEFAULT_BRANCH_REF"
          if [ "$EVENT_ACTION" = "synchronize" ] && [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$EVENT_BEFORE" HEAD 2>/dev/null; then
            FROM_REF="$EVENT_BEFORE"
          fi
          echo "Computed commit-lint range start (--from): $FROM_REF"
          TO_REF="HEAD"
          if [ -n "$PR_HEAD_SHA" ] && git cat-file -e "$PR_HEAD_SHA^{commit}" 2>/dev/null; then
            TO_REF="$PR_HEAD_SHA"
          fi
          echo "Computed commit-lint range end (--to): $TO_REF"
          /tmp/commitlint-run/node_modules/.bin/commitlint --from="$FROM_REF" --to="$TO_REF" --config $GITHUB_WORKSPACE/.github/workflows/configs/commitlint.config.cjs
