# Android instrumentation (androidTest) tests for the app module.
#
# This job runs the app module's connected instrumentation tests on an Android
# emulator. It is intentionally non-blocking (continue-on-error: true) while the
# emulator harness stabilizes on CI, so emulator infrastructure flakiness does
# not block pull requests. Once it proves reliable it can be promoted to a
# required check by removing continue-on-error and adding it to branch protection.
name: Android instrumentation tests

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  connected-android-test:
    name: app connectedDebugAndroidTest (emulator)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel
          script: ./gradlew :app:connectedDebugAndroidTest
