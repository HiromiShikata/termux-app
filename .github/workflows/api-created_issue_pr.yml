name: Add to Project

on:
  workflow_dispatch:
    inputs:
      issue_or_pr_url:
        description: 'Issue or PR URL (https://github.com/<owner>/<repo>/issues/<number> or .../pull/<number>)'
        required: true
        default: ''

permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-slim
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Add to Project
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE_OR_PR_URL_INPUT: ${{ github.event.inputs.issue_or_pr_url }}
        run: bash scripts/add-url-item-to-project-board.sh "$ISSUE_OR_PR_URL_INPUT"
