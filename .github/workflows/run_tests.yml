name: Unit tests

on:
  push:
    branches:
      - master
      - main
      - android-10
  pull_request:
    branches:
      - master
      - main
      - android-10
      - main

concurrency:
  group: unit-tests-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  testing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Clone repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup java 17
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    - name: Verify dependency vulnerability fixes
      run: |
        ./gradlew --init-script gradle/verify-dependency-vulnerability-fixes.init.gradle \
            verifyBuildscriptDependencyVulnerabilityFixes \
            :app:verifyRobolectricBouncyCastleTestClasspathFix \
            :termux-shared:verifyRobolectricBouncyCastleTestClasspathFix \
            :terminal-view:verifyRobolectricBouncyCastleTestClasspathFix \
            :app:verifyModuleConfigurationsDependencyVulnerabilityFixes \
            :termux-shared:verifyModuleConfigurationsDependencyVulnerabilityFixes \
            :terminal-emulator:verifyModuleConfigurationsDependencyVulnerabilityFixes \
            :terminal-view:verifyModuleConfigurationsDependencyVulnerabilityFixes
    - name: Execute tests with JaCoCo coverage
      run: |
        ./gradlew jacocoTestReport
    - name: Print overall coverage percentage to the log
      run: |
        REPORT="build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml"
        COVERED=$(grep -oE '<counter type="INSTRUCTION" missed="[0-9]+" covered="[0-9]+"/>' "$REPORT" | tail -1 | sed -E 's/.*covered="([0-9]+)".*/\1/')
        MISSED=$(grep -oE '<counter type="INSTRUCTION" missed="[0-9]+" covered="[0-9]+"/>' "$REPORT" | tail -1 | sed -E 's/.*missed="([0-9]+)".*/\1/')
        TOTAL=$((COVERED + MISSED))
        if [ "$TOTAL" -gt 0 ]; then
          PCT=$(awk "BEGIN { printf \"%.2f\", ($COVERED / $TOTAL) * 100 }")
        else
          PCT="0.00"
        fi
        echo "Overall instruction coverage: ${PCT}% (${COVERED}/${TOTAL} instructions covered)"
    - name: Upload JaCoCo coverage report (HTML + XML)
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: jacoco-coverage-report
        path: |
          build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          build/reports/jacoco/jacocoTestReport/html
    - name: Post JaCoCo coverage report as a PR comment
      if: github.event_name == 'pull_request'
      uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
      with:
        paths: build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        title: Unit-test coverage (JaCoCo)
        min-coverage-overall: 0
        min-coverage-changed-files: 0
