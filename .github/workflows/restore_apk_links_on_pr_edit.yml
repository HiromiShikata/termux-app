name: Restore APK links on PR edit

on:
  pull_request:
    types: [edited]

concurrency:
  group: post-artifact-links-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  restore_artifact_links:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Restore APK download links if missing
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const startMarker = '<!-- apk-artifact-links -->';
            const endMarker = '<!-- /apk-artifact-links -->';
            const currentBody = pr.body || '';

            if (currentBody.includes(startMarker)) {
              console.log('APK link block already present, nothing to do.');
              return;
            }

            const headSha = context.payload.pull_request.head.sha;

            const runIterator = github.paginate.iterator(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'debug_build.yml',
                head_sha: headSha,
                status: 'completed',
                per_page: 100
              }
            );

            let latestRun = null;
            for await (const { data: runs } of runIterator) {
              for (const run of runs) {
                if (run.conclusion !== 'success') {
                  continue;
                }
                if (latestRun === null || run.run_number > latestRun.run_number) {
                  latestRun = run;
                }
              }
            }

            if (latestRun === null) {
              console.log('No successful Build run found for the head commit, skipping.');
              return;
            }

            const suiteId = latestRun.check_suite_id;

            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: latestRun.id,
              per_page: 100
            });

            const makeUrl = (a) => `https://github.com/${context.repo.owner}/${context.repo.repo}/suites/${suiteId}/artifacts/${a.id}`;

            const recommendedArtifactNamePrefix = 'termux-app-RECOMMENDED-INSTALL-THIS';
            const arm64Artifact = artifacts.find(a => a.name.startsWith(recommendedArtifactNamePrefix) && a.name.endsWith('arm64-v8a'));

            const section = [
              startMarker,
              arm64Artifact ? `APK: ${makeUrl(arm64Artifact)}` : '(artifact not found)',
              endMarker
            ].join('\n');

            const newBody = currentBody + '\n\n' + section;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: newBody
            });

            console.log('APK link block restored.');
