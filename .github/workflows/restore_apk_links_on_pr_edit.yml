name: Restore APK links on PR edit

on:
  pull_request:
    types: [edited]

concurrency:
  group: restore-apk-links-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  restore_artifact_links:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Restore APK download links if missing
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const startMarker = '<!-- apk-artifact-links -->';
            const endMarker = '<!-- /apk-artifact-links -->';
            const currentBody = pr.body || '';

            if (currentBody.includes(startMarker)) {
              console.log('APK link block already present, nothing to do.');
              return;
            }

            const headSha = context.payload.pull_request.head.sha;

            const { data: { workflow_runs: allRuns } } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'debug_build.yml',
              head_sha: headSha,
              status: 'completed',
              per_page: 10
            });
            const runs = allRuns
              .filter(r => r.conclusion === 'success')
              .sort((a, b) => b.run_number - a.run_number);

            if (runs.length === 0) {
              console.log('No successful Build run found for head commit, skipping.');
              return;
            }

            const latestRun = runs[0];
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${latestRun.id}`;
            const suiteId = latestRun.check_suite_id;

            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: latestRun.id,
              per_page: 100
            });

            const makeUrl = (a) => `https://github.com/${context.repo.owner}/${context.repo.repo}/suites/${suiteId}/artifacts/${a.id}`;

            const arm64Artifact = artifacts
              .filter(a => a.name.includes('apt-android-7') && a.name.endsWith('_arm64-v8a'))
              .sort((a, b) => a.name.localeCompare(b.name))[0];

            const artifactPart = arm64Artifact ? `[${arm64Artifact.name}](${makeUrl(arm64Artifact)})` : '(artifact not found)';
            const section = [
              startMarker,
              `- APK: ${artifactPart} ([Full build](${runUrl}))`,
              endMarker
            ].join('\n');

            const newBody = currentBody + '\n\n' + section;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: newBody
            });

            console.log('APK link block restored.');
