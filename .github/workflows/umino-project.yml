# DO NOT EDIT DIRECTLY.
# This file is auto-synchronized from HiromiShikata/repositories-management.
# Direct edits in downstream repositories will be overwritten by the next sync.
# Update the source file in HiromiShikata/repositories-management instead.

name: UMINO Project

permissions:
  contents: read

on:
  issues:
    types:
      - opened
      - reopened
      - labeled
  pull_request:
    types:
      - opened
      - reopened
      - review_requested
      - labeled
      - edited
      - synchronize

env:
  awaiting_workspace: Awaiting Workspace
  in_progress: In Progress
  user: HiromiShikata
  project_id: 48

jobs:
  umino-job:
    if: >-
      github.repository != 'HiromiShikata/test-repository' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'app/dependabot' &&
      github.event.action != 'labeled' &&
      (
        (github.event_name == 'issues' &&
         (github.event.action == 'opened' || github.event.action == 'reopened')) ||
        (github.event_name == 'pull_request' && github.event.action == 'opened')
      )
    runs-on: ubuntu-slim
    timeout-minutes: 7
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Generate hs-bot-gh-ap installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HS_BOT_GH_AP_CLIENT_ID }}
          private-key: ${{ secrets.HS_BOT_GH_AP_PRIVATE_KEY }}
          owner: HiromiShikata
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: >-
          github.event_name == 'issues' && github.event.issue.state == 'open' &&
          (github.event.action == 'opened' || github.event.action == 'reopened')
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: >-
          github.event_name == 'issues' && github.event.issue.state == 'open' &&
          (github.event.action == 'opened' || github.event.action == 'reopened')
        with:
          node-version: 24
      - name: Select project board
        id: board
        run: |
          bash scripts/project-board-selection.sh >> "$GITHUB_OUTPUT"
        env:
          REPOSITORY_VARIABLE_PROJECT_V2_ID: ${{ vars.PROJECT_V2_ID }}
          REPOSITORY_VARIABLE_PROJECT_STATUS_FIELD_ID: ${{ vars.PROJECT_STATUS_FIELD_ID }}
          REPOSITORY_VARIABLE_PROJECT_AWAITING_WORKSPACE_OPTION_ID: ${{ vars.PROJECT_AWAITING_WORKSPACE_OPTION_ID }}
          REPOSITORY_VARIABLE_PROJECT_CLEAR_FIELD_ID: ${{ vars.PROJECT_CLEAR_FIELD_ID }}
        if: >-
          github.event_name == 'issues' && github.event.issue.state == 'open' &&
          (github.event.action == 'opened' || github.event.action == 'reopened')
      - name: Move issue to ${{ env.awaiting_workspace }}
        run: |
          bash scripts/ensure-repositories-management-scripts-typescript.sh
          cd scripts/typescript
          npm i
          npx tsx src/adapter/entry-points/cli/add-project-board-item.ts
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PROJECT_V2_ID: ${{ steps.board.outputs.PROJECT_V2_ID }}
          STATUS_FIELD_ID: ${{ steps.board.outputs.STATUS_FIELD_ID }}
          AWAITING_WORKSPACE_OPTION_ID: ${{ steps.board.outputs.AWAITING_WORKSPACE_OPTION_ID }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          PULL_REQUEST_NODE_ID: ${{ github.event.pull_request.node_id }}
        if: >-
          github.event_name == 'issues' && github.event.issue.state == 'open' &&
          (github.event.action == 'opened' || github.event.action == 'reopened')
      - run: |
          if [ -z "$CLEAR_FIELD_ID" ]; then
            echo "The selected project board has no clear field; skipping the clear step"
            exit 0
          fi
          OWNER=$(echo ${{ github.repository }} | cut -d '/' -f 1)
          REPO=$(echo ${{ github.repository }} | cut -d '/' -f 2)
          ENTITY_TYPE=$(echo "$EVENT_NAME" | grep -q "pull_request" && echo "pullRequest" || echo "issue")
          NUMBER=$(echo "$EVENT_NAME" | grep -q "pull_request" && echo "$PR_NUMBER" || echo "$ISSUE_NUMBER")

          QUERY_DATA='{ "query": "query { repository(owner: \"'$OWNER'\", name: \"'$REPO'\") { '${ENTITY_TYPE}'(number: '$NUMBER') { projectItems(first: 10) { nodes { id } } } } }" }'
          RESPONSE=$(curl -X POST -H "Authorization: Bearer $GH_PROJECT_TOKEN" -H "Content-Type: application/json" --data "$QUERY_DATA" https://api.github.com/graphql)

          if echo $RESPONSE | grep -q "errors"; then
            echo "Error in GraphQL query"
            echo "GraphQL Response: $RESPONSE"
            exit 1
          fi

          if [ "$ENTITY_TYPE" = "pullRequest" ]; then
            ITEM_ID=$(echo $RESPONSE | jq -r '.data.repository.pullRequest.projectItems.nodes[0].id')
          else
            ITEM_ID=$(echo $RESPONSE | jq -r '.data.repository.issue.projectItems.nodes[0].id')
          fi

          if [ "$ITEM_ID" = "null" ] || [ -z "$ITEM_ID" ]; then
            echo "No valid item ID found, cannot proceed"
            exit 1
          fi

          CLEAR_FIELD_DATA="{\"query\":\"mutation { clearProjectV2ItemFieldValue(input: {projectId: \\\"$PROJECT_V2_ID\\\", fieldId: \\\"$CLEAR_FIELD_ID\\\", itemId: \\\"$ITEM_ID\\\"}) { clientMutationId }}\"}"
          CLEAR_RESPONSE=$(curl --request POST \
            --url https://api.github.com/graphql \
            --header "Authorization: Bearer $GH_PROJECT_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$CLEAR_FIELD_DATA")

          if echo $CLEAR_RESPONSE | grep -q "errors"; then
            echo "Error in clearing field"
            echo "Clear Field Response: $CLEAR_RESPONSE"
            exit 1
          fi
        env:
          GH_PROJECT_TOKEN: ${{ secrets.GH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PROJECT_V2_ID: ${{ steps.board.outputs.PROJECT_V2_ID }}
          CLEAR_FIELD_ID: ${{ steps.board.outputs.CLEAR_FIELD_ID }}
        if: >-
          github.event_name == 'issues' && github.event.issue.state == 'open' &&
          (github.event.action == 'opened' || github.event.action == 'reopened')

      - name: Auto assign issue to owner
        if: >-
          github.event_name == 'issues' &&
          github.event.action == 'opened'
        uses: pozil/auto-assign-issue@d6e511896e5f1d2408e74db74416647d8ff80c8c # v4.1.0
        with:
          assignees: HiromiShikata
          repo-token: ${{ steps.app-token.outputs.token }}
      - name: Auto assign PR to owner
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'opened'
        uses: pozil/auto-assign-issue@d6e511896e5f1d2408e74db74416647d8ff80c8c # v4.1.0
        with:
          assignees: HiromiShikata
          repo-token: ${{ steps.app-token.outputs.token }}

  check_pull_requests_to_link_issues:
    runs-on: ubuntu-slim
    timeout-minutes: 7
    name: Check linked issues in pull requests
    if: >-
      vars.PULL_REQUEST_CHECKS_IN_REPOSITORY_CI != 'true' &&
      github.repository != 'HiromiShikata/test-repository' &&
      (github.event_name == 'pull_request') &&
      (github.event.action == 'edited' ||
       github.event.action == 'synchronize' ||
       github.event.action == 'reopened') &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'app/dependabot' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Generate hs-bot-gh-ap installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HS_BOT_GH_AP_CLIENT_ID }}
          private-key: ${{ secrets.HS_BOT_GH_AP_PRIVATE_KEY }}
          owner: HiromiShikata
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'app/dependabot'
        with:
          # The step below receives the owner-wide app token, so it must run base-branch code, never the pull request head.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'app/dependabot'
        with:
          node-version: 24
      - name: Check linked issues in pull request description
        id: check-linked-issues
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'app/dependabot'
        run: bash scripts/check-pull-request-linked-issues-runner.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ACCOUNT_OWNER: HiromiShikata
