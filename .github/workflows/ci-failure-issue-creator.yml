name: CI Failure Issue Creator

on:
  workflow_run:
    types:
      - completed
    workflows: ['*']

jobs:
  create-or-comment-issue:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == github.event.repository.default_branch && github.event.workflow_run.name != github.workflow
    runs-on: ubuntu-slim
    timeout-minutes: 7
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Derive issue title and check results URL
        id: details
        run: scripts/ci-fetch-check-run-details.sh
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      - name: Create or comment on CI failure issue
        run: scripts/ci-failure-default-branch-upsert-issue.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_TITLE: ${{ steps.details.outputs.issue_title }}
          CHECK_RESULTS_URL: ${{ steps.details.outputs.check_results_url }}
