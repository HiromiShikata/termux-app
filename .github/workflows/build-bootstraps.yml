name: Build Bootstraps

on:
  workflow_dispatch:
    inputs:
      termux_packages_ref:
        description: 'termux/termux-packages git ref to build from'
        required: true
        default: 'bootstrap-2026.05.17-r1+apt.android-7'
      release_tag:
        description: 'Release tag to publish the fork bootstrap zips under'
        required: true
        default: 'bootstrap-com.termux.hs.shortcut-2026.05.17-r1'

env:
  TERMUX_APP_PACKAGE_NAME: com.termux.hs.shortcut
  TERMUX_PACKAGES_REF: ${{ github.event.inputs.termux_packages_ref || 'bootstrap-2026.05.17-r1+apt.android-7' }}
  RELEASE_TAG: ${{ github.event.inputs.release_tag || 'bootstrap-com.termux.hs.shortcut-2026.05.17-r1' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ aarch64, arm, i686, x86_64 ]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h

      - name: Clone termux-packages
        uses: actions/checkout@v6
        with:
          repository: termux/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_REF }}
          path: termux-packages

      - name: Set fork package name in properties.sh
        working-directory: termux-packages
        run: |
          sed -i -E "s/^TERMUX_APP__PACKAGE_NAME=\"com.termux\"/TERMUX_APP__PACKAGE_NAME=\"${TERMUX_APP_PACKAGE_NAME}\"/" scripts/properties.sh
          echo "Verifying package name was set:"
          grep -E "^TERMUX_APP__PACKAGE_NAME=" scripts/properties.sh
          if ! grep -qE "^TERMUX_APP__PACKAGE_NAME=\"${TERMUX_APP_PACKAGE_NAME}\"$" scripts/properties.sh; then
            echo "Failed to set TERMUX_APP__PACKAGE_NAME in scripts/properties.sh"
            exit 1
          fi

      - name: Replace bzip2 with libbz2 in PACKAGES list
        working-directory: termux-packages
        run: |
          # bzip2 is a subpackage of libbz2 and has no own source dir.
          # When deps download is disabled (forced because the fork app name differs
          # from the repo app name), build-package.sh cannot resolve bzip2 by name
          # and aborts with "No package bzip2 found in any of the enabled repositories".
          # Building libbz2 from source produces both libbz2.deb and bzip2.deb,
          # so the bootstrap still receives bzip2 through the normal extract_debs step.
          sed -i 's/PACKAGES+=("bzip2")/PACKAGES+=("libbz2")/' scripts/build-bootstraps.sh
          echo "Verifying patch:"
          grep -nE 'PACKAGES\+=\("(libbz2|bzip2)"\)' scripts/build-bootstraps.sh
          if grep -qE 'PACKAGES\+=\("bzip2"\)' scripts/build-bootstraps.sh; then
            echo "Failed to replace bzip2 with libbz2"
            exit 1
          fi
          if ! grep -qE 'PACKAGES\+=\("libbz2"\)' scripts/build-bootstraps.sh; then
            echo "libbz2 not present after patch"
            exit 1
          fi

      - name: Build bootstrap for ${{ matrix.arch }}
        working-directory: termux-packages
        run: |
          ./scripts/run-docker.sh bash -c '
            cd ~/termux-packages
            source scripts/properties.sh
            echo "ANDROID_HOME=$ANDROID_HOME"
            if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDK_MANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
            elif [ -x "${ANDROID_HOME}/cmdline-tools/bin/sdkmanager" ]; then
              SDK_MANAGER="${ANDROID_HOME}/cmdline-tools/bin/sdkmanager"
            else
              echo "ERROR: sdkmanager not found in ${ANDROID_HOME}" >&2
              find "${ANDROID_HOME}" -name sdkmanager 2>/dev/null >&2
              exit 1
            fi
            echo "Using sdkmanager: ${SDK_MANAGER}"
            yes | "${SDK_MANAGER}" --sdk_root="${ANDROID_HOME}" "platforms;android-33" "build-tools;30.0.3"
            scripts/build-bootstraps.sh --architectures ${{ matrix.arch }}
          '

      - name: Verify fork prefix is baked into the bootstrap
        working-directory: termux-packages
        run: |
          ZIP="bootstrap-${{ matrix.arch }}.zip"
          test -f "$ZIP" || { echo "Bootstrap zip $ZIP not found"; ls -la; exit 1; }
          WORKDIR="$(mktemp -d)"
          unzip -q "$ZIP" -d "$WORKDIR"
          UPSTREAM_PATH="/data/data/com.termux/files/usr/"
          FORK_PATH="/data/data/${TERMUX_APP_PACKAGE_NAME}/files/usr/"
          FAILED=0
          for BINARY in bin/bash bin/dpkg; do
            BIN_PATH="$WORKDIR/$BINARY"
            if [ ! -f "$BIN_PATH" ]; then
              echo "Critical binary $BINARY not found in bootstrap"
              FAILED=1
              continue
            fi
            if strings "$BIN_PATH" | grep -qF "$UPSTREAM_PATH"; then
              echo "FAIL: $BINARY still contains upstream path $UPSTREAM_PATH"
              strings "$BIN_PATH" | grep -F "$UPSTREAM_PATH"
              FAILED=1
            else
              echo "OK: $BINARY does not contain upstream path $UPSTREAM_PATH"
            fi
            if strings "$BIN_PATH" | grep -qF "$FORK_PATH"; then
              echo "OK: $BINARY contains fork path $FORK_PATH"
            else
              echo "FAIL: $BINARY does not contain fork path $FORK_PATH"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "Verified: bootstrap-${{ matrix.arch }}.zip has fork prefix in critical ELF binaries."
          rm -rf "$WORKDIR"

      - name: Compute checksum
        working-directory: termux-packages
        run: |
          sha256sum "bootstrap-${{ matrix.arch }}.zip" | tee "bootstrap-${{ matrix.arch }}.zip.sha256"

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-${{ matrix.arch }}
          path: |
            termux-packages/bootstrap-${{ matrix.arch }}.zip
            termux-packages/bootstrap-${{ matrix.arch }}.zip.sha256

  release:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Download all bootstrap artifacts
        uses: actions/download-artifact@v6
        with:
          path: bootstraps

      - name: Collect zips and checksums
        run: |
          mkdir -p release
          find bootstraps -name 'bootstrap-*.zip' -exec cp {} release/ \;
          cd release
          sha256sum bootstrap-*.zip | tee SHA256SUMS.txt
          ls -la

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              -R "$GITHUB_REPOSITORY" \
              --title "Fork bootstrap ($RELEASE_TAG)" \
              --notes "Termux bootstrap archives built from termux/termux-packages with TERMUX_APP__PACKAGE_NAME=${TERMUX_APP_PACKAGE_NAME} so the prefix /data/data/${TERMUX_APP_PACKAGE_NAME}/files/usr is baked into every binary and text file. Built by .github/workflows/build-bootstraps.yml."
          fi
          echo "Release assets:"
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
