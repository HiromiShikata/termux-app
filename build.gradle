buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
    }
    configurations.classpath {
        resolutionStrategy {
            force "org.bouncycastle:bcprov-jdk18on:1.85"
            force "org.bouncycastle:bcpkix-jdk18on:1.85"
            force "org.bouncycastle:bcutil-jdk18on:1.85"
            force "io.netty:netty-common:4.1.137.Final"
            force "io.netty:netty-buffer:4.1.137.Final"
            force "io.netty:netty-transport:4.1.137.Final"
            force "io.netty:netty-resolver:4.1.137.Final"
            force "io.netty:netty-codec:4.1.137.Final"
            force "io.netty:netty-codec-http:4.1.137.Final"
            force "io.netty:netty-codec-http2:4.1.137.Final"
            force "io.netty:netty-handler:4.1.137.Final"
            force "io.netty:netty-handler-proxy:4.1.137.Final"
            force "io.netty:netty-codec-socks:4.1.137.Final"
            force "io.netty:netty-transport-native-unix-common:4.1.137.Final"
            force "org.bitbucket.b_c:jose4j:0.9.6"
            force "org.jdom:jdom2:2.0.6.1"
        }
    }
}

def availableProcessors = Runtime.runtime.availableProcessors()
def continuousIntegrationTestJvmCount = Math.max(1, availableProcessors)
def developerMachineTestJvmCount = Math.max(1, availableProcessors.intdiv(2))
def runningOnContinuousIntegration = System.getenv("CI") != null
ext.testJvmCount = runningOnContinuousIntegration ? continuousIntegrationTestJvmCount : developerMachineTestJvmCount

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }

    configurations.all {
        resolutionStrategy {
            force "org.bouncycastle:bcprov-jdk18on:1.85"
        }
    }

    tasks.withType(Test).configureEach {
        maxParallelForks = rootProject.ext.testJvmCount

        testLogging {
            events "failed"
            exceptionFormat "full"
            showExceptions true
            showCauses true
            showStackTraces true
        }
    }
}

ext.jacocoToolVersion = "0.8.12"

def jacocoModules = [":app", ":termux-shared", ":terminal-emulator", ":terminal-view"]

subprojects { subproject ->
    if (jacocoModules.contains(subproject.path)) {
        subproject.apply plugin: "jacoco"

        subproject.jacoco {
            toolVersion = rootProject.ext.jacocoToolVersion
        }

        subproject.afterEvaluate {
            subproject.android.buildTypes.debug.enableUnitTestCoverage true
        }

        subproject.tasks.withType(Test).configureEach {
            jacoco {
                includeNoLocationClasses = true
                excludes = ["jdk.internal.*"]
            }
        }
    }
}

ext.jacocoCoverageExcludes = [
    "**/R.class",
    "**/R\$*.class",
    "**/BuildConfig.*",
    "**/Manifest*.*",
    "**/*Test*.*",
    "android/**/*.*",
    "**/databinding/**",
    "**/android/databinding/*Binding.*",
    "**/*_MembersInjector.class",
    "**/Dagger*Component*.*",
    "**/*Module_*Factory.class"
]

apply plugin: "jacoco"

jacoco {
    toolVersion = rootProject.ext.jacocoToolVersion
}

tasks.register("jacocoTestReport", JacocoReport) {
    group = "verification"
    description = "Aggregates JaCoCo unit-test (testDebugUnitTest) coverage across all modules into a single HTML + XML report."

    def coveredModules = jacocoModules.collect { project(it) }
    def excludes = rootProject.ext.jacocoCoverageExcludes

    dependsOn coveredModules.collect { "${it.path}:testDebugUnitTest" }

    sourceDirectories.setFrom(files(coveredModules.collect { "${it.projectDir}/src/main/java" }))
    classDirectories.setFrom(files(coveredModules.collect { module ->
        files(
            fileTree(dir: "${module.buildDir}/tmp/kotlin-classes/debug", excludes: excludes),
            fileTree(dir: "${module.buildDir}/intermediates/javac/debug/classes", excludes: excludes),
            fileTree(dir: "${module.buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: excludes)
        )
    }))
    executionData.setFrom(files(coveredModules.collect { module ->
        fileTree(dir: module.buildDir, includes: [
            "outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec",
            "jacoco/testDebugUnitTest.exec"
        ])
    }))

    reports {
        html.required = true
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir("reports/jacoco/jacocoTestReport/html")
        xml.outputLocation = layout.buildDirectory.file("reports/jacoco/jacocoTestReport/jacocoTestReport.xml")
    }
}
